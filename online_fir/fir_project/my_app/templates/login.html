{% extends "base.html" %}
{% load static %}

{% block content %}

<style>

/* Section */
.login-section{
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
padding:40px 15px;
background:#f5f7fb;
}

/* Card */
.login-card{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 35px rgba(0,0,0,0.08);
width:100%;
max-width:450px;
animation:fadeUp 0.8s ease;
}

/* Animation */
@keyframes fadeUp{
0%{
opacity:0;
transform:translateY(30px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

/* Title */
.login-title{
font-weight:600;
margin-bottom:25px;
text-align:center;
}

/* Input */
.form-control{
border-radius:12px;
padding:12px;
border:1px solid #e0e0e0;
transition:0.3s;
}

.form-control:focus{
box-shadow:none;
border-color:#0b3d91;
}

/* Button */
.login-btn{
background:#0b3d91;
color:white;
padding:12px;
border-radius:30px;
font-weight:600;
transition:0.3s;
}

.login-btn:hover{
background:#062c6a;
transform:translateY(-2px);
box-shadow:0 8px 20px rgba(0,0,0,0.15);
}

/* Links */

.login-links a{
text-decoration:none;
font-weight:500;
color:#0b3d91;
}

.login-links a:hover{
text-decoration:underline;
}

/* Divider */

.divider{
text-align:center;
margin:20px 0;
position:relative;
}

.divider::before{
content:"";
position:absolute;
width:40%;
height:1px;
background:#ddd;
left:0;
top:50%;
}

.divider::after{
content:"";
position:absolute;
width:40%;
height:1px;
background:#ddd;
right:0;
top:50%;
}


/* Responsive */

@media(max-width:768px){

.login-card{
padding:25px;
}

}

</style>
{% for i in messages %}
<script>alert("{{i}}")</script>
{% endfor %}
<div class="login-section">

<div class="login-card">

<h3 class="login-title">
Login to Your Account
</h3>

<form method="POST">

{% csrf_token %}

<div class="mb-3">
<label>Email</label>
<input type="email" class="form-control" name="email" required>
</div>

<div class="mb-3">
<label>Password</label>
<input type="password" class="form-control" name="password" required>
</div>

<button class="btn login-btn w-100">
Login
</button>

<div class="divider">
or
</div>

<div class="text-center login-links">

<p>
Don't have account?
<a href="{% url "register" %}">Register</a>
</p>

<p>
<a href="#">Forgot Password?</a>
</p>

</div>

</form>

</div>

</div>

{% endblock %}
