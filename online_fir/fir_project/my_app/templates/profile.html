{% extends "base.html" %}
{% load static %}

{% block content %}

<style>

.profile-section{
min-height:90vh;
display:flex;
justify-content:center;
align-items:center;
background:#f5f7fb;
padding:40px 15px;
}

.profile-card{
background:white;
padding:35px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
width:100%;
max-width:600px;
animation:fadeUp 0.8s ease;
}

@keyframes fadeUp{
0%{
opacity:0;
transform:translateY(30px);
}
100%{
opacity:1;
transform:translateY(0);
}
}

.profile-title{
text-align:center;
margin-bottom:25px;
font-weight:600;
}

.form-control{
border-radius:12px;
padding:12px;
border:1px solid #e0e0e0;
}

.form-control:focus{
box-shadow:none;
border-color:#0b3d91;
}

.save-btn{
background:#0b3d91;
color:white;
padding:12px;
border-radius:30px;
font-weight:500;
transition:0.3s;
}

.save-btn:hover{
background:#062c6a;
transform:translateY(-2px);
}

</style>


<div class="profile-section">

<div class="profile-card">

<h3 class="profile-title">My Profile</h3>

<form action="{% url "update" usr.id %}" method="POST">

{% csrf_token %}

<div class="mb-3">
<label>Full Name</label>
<input type="text" name="name" class="form-control" value="{{ usr.name }}">
</div>

<div class="mb-3">
<label>Email</label>
<input type="email" name="email" class="form-control" value="{{ usr.email }}" readonly>
</div>

<div class="mb-3">
<label>Phone</label>
<input type="text" name="phone" class="form-control" value="{{ usr.phone }}">
</div>

<div class="mb-3">
<label>Address</label>
<textarea name="address" class="form-control">{{ usr.address }}</textarea>
</div>

<div class="row">

<div class="col-md-6">
<div class="mb-3">
<label>City</label>
<input type="text" name="city" class="form-control" value="{{ usr.city }}">
</div>
</div>

<div class="col-md-6">
<div class="mb-3">
<label>State</label>
<input type="text" name="state" class="form-control" value="{{ usr.state }}">
</div>
</div>

</div>

<div class="mb-3">
<label>password</label>
<input type="password" name="password" class="form-control" value="{{ usr.password }}">
</div>


<button class="btn save-btn w-100">
Update Profile
</button>

</form>

</div>

</div>

{% endblock %}
