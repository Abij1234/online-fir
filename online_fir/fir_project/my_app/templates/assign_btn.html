{% extends 'base.html' %}

{% block content %}

<div class="container mt-4">

```
<!-- Page Title -->
<div class="row">
    <div class="col-md-12">
        <h3 class="fw-bold">Assign FIR</h3>
        <hr>
    </div>
</div>

<div class="row">

    <div class="col-lg-8 mx-auto">

        <div class="card shadow-lg border-0">

            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Assign Officer</h5>
            </div>

            <div class="card-body">

                <!-- FIR Details -->

                <div class="alert alert-info">

                    <h6>FIR Details</h6>

                    <p><strong>FIR Number :</strong> {{fir.fir_number}}</p>
                    <p><strong>Category :</strong> {{fir.crime_type}}</p>
                    <p><strong>Status :</strong> {{fir.status}}</p>

                </div>


                <!-- Assign Form -->

                <form method="POST">

                    {% csrf_token %}

                    <div class="mb-3">

                        <label class="form-label fw-bold">
                            Select Officer
                        </label>

                        <select name="officer" class="form-control" required>

                            <option value="">Choose Officer</option>

                            {% for officer in officers %}

                            <option value="{{officer.id}}">
                                {{officer.name}} - {{officer.post}}
                            </option>

                            {% endfor %}

                        </select>

                    </div>


                    <div class="d-flex justify-content-between">

                        <a href="{% url 'policedashboard' %}" 
                           class="btn btn-secondary">
                            Back
                        </a>

                        <button type="submit" 
                                class="btn btn-primary">

                            Assign FIR

                        </button>

                    </div>


                </form>


            </div>

        </div>

    </div>

</div>
```

</div>

{% endblock %}
